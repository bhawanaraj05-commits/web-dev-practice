<!DOCTYPE html>
<html>
<head>
    <title>Movies</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color:white;
        }
        .heading {
            margin-left: 136px;
            margin-top: 50px;
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 28px;
            margin: 0;
        }

        .movies {
            display: flex;
            gap: 20px;
            margin-left: 136px;
            margin-top: 112px;
        }

        .movie-card {
            width: 245px;
            border: 1px solid #ddd;
            border-radius: 18px;
            overflow: hidden;
            background-color: white;
        }

        .movie-card img {
            width: 245px;
            height: 325px;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            padding: 14px;
            height: 78px;
        }

        .movie-info h2 {
            font-size: 20px;
            margin: 0 0 6px 0;
            line-height: 23px;
        }

        .movie-info p {
            margin: 0;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="heading">
        <h1>Top Hindi Movies Near You...</h1>
    </div>

    <div class="movies">

        <div class="movie-card">
            <img src="https://cdn.district.in/movies-assets/images/cinema/Hanuman-Ansh-3199a900-6975-11f1-a51b-91d242246b61.jpg">

            <div class="movie-info">
                <h2>Hanuman Ansh</h2>
                <p><b>U</b> | Hindi</p>
            </div>
        </div>

        <div class="movie-card">
            <img src="https://cdn.district.in/movies-assets/images/cinema/toxiv%3Dc-8340c900-9c6f-11f1-97d4-73a32236137e.jpg">

            <div class="movie-info">
                <h2>Toxic: A Fairy Tale for Grown-ups</h2>
                <p><b>A</b> | Hindi and 1 more</p>
            </div>
        </div>

        <div class="movie-card">
            <img src="https://cdn.district.in/movies-assets/images/cinema/_Poster-d0d78f60-961a-11f1-8483-eb84b060bac3.jpg">

            <div class="movie-info">
                <h2>Mirzapur: The Movie</h2>
                <p><b>A</b> | Hindi</p>
            </div>
        </div>

        <div class="movie-card">
            <img src="https://cdn.district.in/movies-assets/images/cinema/AW_Poster-18591030-9548-11f1-b29d-8985d3d6c644.jpg">

            <div class="movie-info">
                <h2>Awarapan 2</h2>
                <p><b>UA16+</b> | Hindi</p>
           </div>
       </div>

    </div>

</body>
</html>
