<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loader</title>

    <style>
        .container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader {
            height: 60px;
            width: 60px;
            border: 5px solid white;
            border-radius: 50%;
            border-top-color: blue;
            animation: spinner 1s linear infinite;
        }

        @keyframes spinner {
            from{

            }            
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="loader"></div>
    </div>
</body>
</html>
